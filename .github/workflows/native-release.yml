name: Native release

# Builds the Docker-free snagentic application bundle (CLI + Copilot extension + UI runner
# + private Node.js) for macOS and Windows, smoke-tests the installed artifact outside the
# checkout, and publishes archives on version tags. Tags are signed and notarized when the
# signing secrets are configured; without them the release is published unsigned and
# marked as such (install.sh / install.ps1 install unsigned builds without warnings).

on:
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - ".github/extensions/**"
      - "packaging/**"
      - "pyproject.toml"
      - "requirements/**"
      - ".github/workflows/native-release.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Native tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check .
          mypy src
          mypy --platform win32 src
          mypy --platform linux src
      - name: Python tests without Docker
        run: pytest --cov=snagentic --cov-fail-under=88
      - name: Extension and UI runner tests
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test

  build:
    name: Bundle ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Signing secrets live in the protected `release` environment, used only for tags.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install build dependencies
        run: python -m pip install -c requirements/constraints.txt ".[native]"
      - name: Build bundle
        run: python packaging/build_native.py --output dist/native
      - name: Smoke-test the bundle outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$PWD/dist/native/snagentic/snagentic.exe"; else exe="$PWD/dist/native/snagentic/snagentic"; fi
          work="$(mktemp -d)"
          cd "$work"
          # Python, Node and Docker must not be needed by the installed bundle.
          git_dir="$(dirname "$(command -v git)")"
          export PATH="/usr/bin:/bin:$git_dir"
          "$exe" --version
          "$exe" --json doctor --local | tee doctor.json
          grep -q '"native": true' doctor.json
          grep -q '"playwright": "' doctor.json
          "$exe" --json copilot install --target "$work/extensions"
          "$exe" --json copilot status --target "$work/extensions" | grep -q '"current": true'
          "$exe" --json copilot uninstall --target "$work/extensions"
          git init -q
          "$exe" --json instance add ci-smoke --url https://ci-smoke.example.service-now.com --kind development --credential-store keychain
          "$exe" --json instance -i ci-smoke profile | grep -q '"store": "keychain"'
      - name: Real OS credential store round trip
        if: runner.os != 'Linux'
        shell: bash
        env:
          SNAGENTIC_CISMOKE_USERNAME: ci-user
          SNAGENTIC_CISMOKE_PASSWORD: ci-dummy-not-a-secret
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$PWD/dist/native/snagentic/snagentic.exe"; else exe="$PWD/dist/native/snagentic/snagentic"; fi
          work="$(mktemp -d)"; cd "$work"; git init -q
          "$exe" --json instance add cismoke --url https://ci-smoke.example.service-now.com --kind development --credential-store keychain
          "$exe" --json auth login -i cismoke --from-env
          "$exe" --json auth status -i cismoke | tee status.json
          ! grep -q "ci-dummy-not-a-secret" status.json
          "$exe" --json auth logout -i cismoke
      - name: Install Chromium and launch the UI runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$PWD/dist/native/snagentic/snagentic.exe"; else exe="$PWD/dist/native/snagentic/snagentic"; fi
          "$exe" --json ui install
          "$exe" --json ui status | grep -q '"ready": true'
      - name: Install the bundle with install.sh
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cat dist/native/*.sha256 > dist/native/SHA256SUMS
          home="$(mktemp -d)"
          HOME="$home" SNAGENTIC_DOWNLOAD_URL="$PWD/dist/native" SNAGENTIC_NO_COPILOT=1 \
            sh packaging/install/install.sh
          PATH=/usr/bin:/bin "$home/.local/bin/snagentic" --version
          rm dist/native/SHA256SUMS
      - name: Install the bundle with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content dist/native/*.sha256 | Set-Content -Encoding ascii dist/native/SHA256SUMS
          $env:SNAGENTIC_HOME = Join-Path $env:RUNNER_TEMP 'snagentic-install'
          $env:SNAGENTIC_DOWNLOAD_URL = (Resolve-Path dist/native).Path
          $env:SNAGENTIC_NO_COPILOT = '1'
          ./packaging/install/install.ps1
          & (Join-Path $env:SNAGENTIC_HOME 'snagentic.exe') --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item dist/native/SHA256SUMS
      - name: Record signing status
        shell: bash
        run: |
          signed=false
          if [ "$RELEASE" = "true" ]; then
            if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_MACOS_SIGNING" = "true" ]; then signed=true; fi
            if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WINDOWS_SIGNING" = "true" ]; then signed=true; fi
            [ "$signed" = "true" ] || echo "::warning::signing secrets are not configured; publishing an unsigned ${{ matrix.target }} build"
          fi
          echo "SIGNED=$signed" >> "$GITHUB_ENV"
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          bundle=dist/native/snagentic
          find "$bundle" -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" -o -name "*.node" \) -print0 |
            xargs -0 codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY"
          ditto -c -k --keepParent "$bundle" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - name: Authenticode sign (Windows)
        if: runner.os == 'Windows' && env.SIGNED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem dist/native/snagentic -Recurse -Include *.exe,*.dll,*.pyd,*.node |
            ForEach-Object { & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName }
          Remove-Item $pfx
      - name: Archive signed bundle
        if: env.SIGNED == 'true'
        shell: bash
        run: |
          rm -f dist/native/*.tar.gz dist/native/*.zip dist/native/*.sha256
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "packaging")
          import build_native
          out = Path("dist/native")
          name = f"snagentic-{build_native.version()}-{build_native.target_name()}"
          print(build_native.archive(out / "snagentic", out, name))
          PY
      - name: Mark the artifact signed or unsigned
        shell: bash
        run: echo "$SIGNED" > "dist/native/${{ matrix.target }}.signed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snagentic-${{ matrix.target }}
          path: |
            dist/native/*.tar.gz
            dist/native/*.zip
            dist/native/*.sha256
            dist/native/*.signed
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: |
            packaging/homebrew
            packaging/install
            src/snagentic/__init__.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          if grep -qvx true artifacts/*.signed; then signed=false; else signed=true; fi
          echo "SIGNED=$signed" >> "$GITHUB_ENV"
          title="snagentic $GITHUB_REF_NAME"
          {
            if [ "$signed" != true ]; then
              title="$title (unsigned)"
              echo "> **Unsigned build.** Install with the scripts below; they verify SHA256SUMS and avoid Gatekeeper and SmartScreen prompts."
              echo
            fi
            echo "## Install"
            echo
            echo '**macOS**'
            echo '```bash'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh | sh"
            echo '```'
            echo '**Windows (PowerShell)**'
            echo '```powershell'
            echo "irm https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.ps1 | iex"
            echo '```'
            echo 'Then: `snagentic auth login -i <instance>`, optionally `snagentic ui install`, and `snagentic doctor`.'
            echo
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$title" \
            --notes-file notes.md --generate-notes \
            artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS \
            source/packaging/install/install.sh source/packaging/install/install.ps1
      # Homebrew downloads casks with the quarantine attribute, so only signed and notarized
      # builds are offered through the cask.
      - name: Render Homebrew cask
        if: env.SIGNED == 'true'
        run: |
          python3 source/packaging/homebrew/render_cask.py --sums artifacts/SHA256SUMS \
            --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" \
            --output cask/snagentic.rb
          gh release upload "$GITHUB_REF_NAME" cask/snagentic.rb --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # Publish to the tap only when both are configured: the repository variable
      # HOMEBREW_TAP (OWNER/homebrew-snagentic) and the release-environment secret
      # HOMEBREW_TAP_TOKEN (fine-grained token with contents:write on that repository).
      - name: Publish cask to the Homebrew tap
        if: vars.HOMEBREW_TAP != '' && env.SIGNED == 'true'
        env:
          TAP: ${{ vars.HOMEBREW_TAP }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then echo "::error::HOMEBREW_TAP_TOKEN is not set"; exit 1; fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Casks
          cp cask/snagentic.rb tap/Casks/snagentic.rb
          cd tap
          git config user.name "snagentic release"
          git config user.email "snagentic-release@users.noreply.github.com"
          git add Casks/snagentic.rb
          git diff --cached --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "snagentic ${GITHUB_REF_NAME#v}"
          git push origin HEAD
