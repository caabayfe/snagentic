name: Promotion validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build validation containers
        run: docker compose build test lint
      - name: Validate ServiceNow JSON and committed change plans
        run: |
          docker compose run --rm --entrypoint python test -c '
          import json
          from pathlib import Path
          from snagentic.changes import load_change_plan
          import yaml

          for path in sorted(Path("servicenow").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
          for path in sorted(Path("servicenow").rglob("*.yaml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          candidates = sorted(Path(".").glob("**/*.change-plan.json"))
          for path in candidates:
              load_change_plan(path)
          print(f"validated ServiceNow JSON and {len(candidates)} change plan(s)")
          '
      - name: Lint and type-check in Docker
        run: docker compose run --rm lint
      - name: Test with coverage in Docker
        run: >-
          docker compose run --rm -T
          -e PYTHONWARNINGS=error::ResourceWarning
          test pytest --cov=snagentic --cov-report=term-missing
          --cov-fail-under=88
      - name: Test extension and UI runner
        run: |
          docker compose run --rm -T --entrypoint sh ui -c '
          npm ci --no-audit --no-fund
          npm test
          '
      - name: Build distributable wheel
        run: >-
          docker compose run --rm -T --entrypoint python
          test -m pip wheel --no-deps --wheel-dir /tmp/dist .
