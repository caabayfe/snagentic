name: Security

on:
  pull_request:
  push:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build audit container
        run: docker compose build test
      - name: Audit Python dependencies
        run: |
          docker compose run --rm -T --entrypoint sh test -c '
          python -m pip freeze --exclude-editable > /tmp/resolved-requirements.txt
          python -m pip_audit -r /tmp/resolved-requirements.txt --strict --progress-spinner off
          python -m pip_audit -r /tmp/resolved-requirements.txt \
            --format cyclonedx-json --output /workspace/python-sbom.json
          '
      - name: Audit Node dependencies
        run: |
          docker compose run --rm -T --entrypoint sh ui -c '
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm sbom --sbom-format cyclonedx > /workspace/node-sbom.json
          '
      - name: Upload dependency SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sboms
          path: |
            python-sbom.json
            node-sbom.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
