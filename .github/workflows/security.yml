name: Security

on:
  pull_request:
  push:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run containers as the runner user
        run: |
          {
            echo "SNAGENTIC_UID=$(id -u)"
            echo "SNAGENTIC_GID=$(id -g)"
            echo "SNAGENTIC_HOME=/tmp"
          } >> "$GITHUB_ENV"
      - name: Build audit container
        run: docker compose build test
      - name: Audit Python dependencies
        run: |
          docker compose run --rm -T --entrypoint sh test -c '
          python -m pip freeze --exclude-editable > /tmp/resolved-requirements.txt
          python -m pip_audit -r /tmp/resolved-requirements.txt --strict --progress-spinner off
          python -m pip_audit -r /tmp/resolved-requirements.txt \
            --format cyclonedx-json --output /workspace/python-sbom.json
          '
      - name: Audit Node dependencies
        run: |
          docker compose run --rm -T --entrypoint sh ui -c '
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm sbom --sbom-format cyclonedx > /workspace/node-sbom.json
          '
      - name: Upload dependency SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sboms
          path: |
            python-sbom.json
            node-sbom.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
